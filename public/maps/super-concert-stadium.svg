<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="100%" height="100%" role="img" aria-label="Sơ đồ mặt bằng sân vận động Mỹ Đình" style="background:#f3f6fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <title>Sơ đồ mặt bằng sân vận động Mỹ Đình</title>
  <desc>Sơ đồ sân vận động tiêu chuẩn Ticketmaster End-Stage với sân khấu ở phía trên, khu Fanzone đứng trước sân khấu và các tầng khán đài VVIP, VIP Platinum, Khán đài A-B, Upper Tier bao quanh. Sinh bởi scripts/build-super-concert-map.mjs.</desc>
  <style>text { pointer-events: none; }</style>
  <defs>
    <linearGradient id="sc-stage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sc-floor-ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="sc-vvip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="sc-vip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="sc-bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sc-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="sc-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Header Bar -->
  <g id="sc-header" data-map-chrome="true">
    <rect x="0" y="0" width="1000" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="1000" y2="56" stroke="#dce4ee" stroke-width="1"/>
    <text x="40" y="35" fill="#1f262d" font-size="16" font-weight="700" letter-spacing="0.8">EVENTTICKETING STADIUM SEATING CHART</text>
    <text x="960" y="35" fill="#525b6c" font-size="13" font-weight="600" text-anchor="end">SƠ ĐỒ SÂN VẬN ĐỘNG MỸ ĐÌNH</text>
  </g>

  <!-- Stadium Outer Perimeter Ring -->
  <path d="M 891.31 180.14 A 472 420 0 1 1 108.69 180.14" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="6 6"/>

  <!-- Stage Complex -->
  <g id="stage-complex" filter="url(#sc-glow)">
    <rect x="330" y="84" width="340" height="84" rx="10" fill="url(#sc-stage-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="124" fill="#f8fafc" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="2.5">SÂN KHẤU · STAGE</text>
    <text x="500" y="148" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">MAIN STADIUM END-STAGE</text>
    <polygon points="460,168 540,168 522,222 478,222" fill="#334155" stroke="#475569" stroke-width="1.2"/>
    <circle cx="500" cy="222" r="22" fill="#0353c2" stroke="#ffffff" stroke-width="2"/>
    <text x="500" y="225" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">B-STAGE</text>
  </g>

  <!-- Floor GA Standing -->
  <g id="floor-ga" filter="url(#sc-glow)">
    <rect data-zone-code="GA_STAND_1" role="button" tabindex="0" aria-label="GA Fanzone Standing 1 (Khu A)" x="340" y="256" width="320" height="114" rx="8" fill="url(#sc-floor-ga)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="500" y="308" fill="#14532d" font-size="15" font-weight="800" text-anchor="middle">STANDING · FANZONE</text>
    <text x="500" y="328" fill="#15803d" font-size="11" font-weight="600" text-anchor="middle">Khu vé đứng tự do sát sân khấu</text>
  </g>

  <!-- Sound & Lighting Mix (FOH) -->
  <rect x="440" y="424" width="120" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="500" y="446" fill="#475569" font-size="10" font-weight="700" text-anchor="middle">ÂM THANH · FOH</text>

  <!-- Seated Stadium Bowls -->
  <g id="sc-zones" filter="url(#sc-glow)">
    <path data-zone-code="ZONE_CD_UP" role="button" tabindex="0" aria-label="Khán đài C-D Tầng cao (Upper Tier)" data-arc="500 415 452 400 352 310 -29 209" d="M 883.32 203.03 A 452 400 0 1 1 116.68 203.03 L 201.49 250.73 A 352 310 0 1 0 798.51 250.73 Z" fill="url(#sc-upper)" stroke="#7c3aed" stroke-width="1.4"/>
    <path data-zone-code="ZONE_A_T1" role="button" tabindex="0" aria-label="Khán đài A Tầng 1 (Tribune A)" data-arc="500 415 326 286 242 210 137 209" d="M 273.54 620.73 A 326 286 0 0 1 223.54 263.44 L 294.77 303.72 A 242 210 0 0 0 331.89 566.06 Z" fill="url(#sc-bowl)" stroke="#d97706" stroke-width="1.4"/>
    <path data-zone-code="ZONE_B_T2" role="button" tabindex="0" aria-label="Khán đài B Tầng 2 (Tribune B)" data-arc="500 415 326 286 242 210 -29 43" d="M 776.46 263.44 A 326 286 0 0 1 726.46 620.73 L 668.11 566.06 A 242 210 0 0 0 705.23 303.72 Z" fill="url(#sc-bowl)" stroke="#d97706" stroke-width="1.4"/>
    <path data-zone-code="VIP_PLATINUM_1" role="button" tabindex="0" aria-label="VIP Platinum 1" data-arc="500 415 326 286 242 210 52 128" d="M 709.55 634.09 A 326 286 0 0 1 290.45 634.09 L 344.45 575.87 A 242 210 0 0 0 655.55 575.87 Z" fill="url(#sc-vip)" stroke="#2563eb" stroke-width="1.6"/>
    <path data-zone-code="VVIP_DIAMOND" role="button" tabindex="0" aria-label="VVIP Diamond Lounge" data-arc="500 415 222 192 162 138 51 129" d="M 648.55 557.68 A 222 192 0 0 1 351.45 557.68 L 391.60 517.55 A 162 138 0 0 0 608.40 517.55 Z" fill="url(#sc-vvip)" stroke="#b45309" stroke-width="1.8"/>
  </g>
  <path d="M 948.03 362.10 L 848.91 374.00 M 932.71 530.61 L 836.98 504.60 M 840.09 678.48 L 764.85 619.19 M 686.72 779.27 L 645.41 697.31 M 500.00 815.00 L 500.00 725.00 M 313.28 779.27 L 354.59 697.31 M 159.91 678.48 L 235.15 619.19 M 67.29 530.61 L 163.02 504.60 M 51.97 362.10 L 151.09 374.00 M 193.66 512.82 L 272.59 486.82 M 175.79 385.10 L 259.33 393.05 M 824.21 385.10 L 740.67 393.05 M 806.34 512.82 L 727.41 486.82 M 575.18 693.29 L 555.81 619.34 M 424.82 693.29 L 444.19 619.34 M 553.71 601.30 L 539.19 548.90 M 446.29 601.30 L 460.81 548.90" fill="none" stroke="rgba(15, 23, 42, 0.14)" stroke-width="1.4" pointer-events="none" aria-hidden="true"/>

  <!-- Zone Labels -->
  <g id="sc-labels" pointer-events="none" aria-hidden="true">
    <text x="500.00" y="766.00" fill="#4c1d95" font-size="13" font-weight="800" text-anchor="middle">KHÁN ĐÀI C-D · UPPER TIER (TẦNG CAO)</text>
    <text x="500.00" y="783.00" fill="#6d28d9" font-size="10" font-weight="600" text-anchor="middle">Tầm nhìn bao quát toàn sân vận động</text>
    <text x="218.12" y="441.22" fill="#78350f" font-size="11" font-weight="800" text-anchor="middle">KHÁN ĐÀI A</text>
    <text x="218.12" y="458.22" fill="#b45309" font-size="10" font-weight="600" text-anchor="middle">Tầng 1</text>
    <text x="781.88" y="441.22" fill="#78350f" font-size="11" font-weight="800" text-anchor="middle">KHÁN ĐÀI B</text>
    <text x="781.88" y="458.22" fill="#b45309" font-size="10" font-weight="600" text-anchor="middle">Tầng 2</text>
    <text x="500.00" y="659.00" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle">VIP PLATINUM 1</text>
    <text x="500.00" y="676.00" fill="#1d4ed8" font-size="10" font-weight="600" text-anchor="middle">Trung tâm tầng 1</text>
    <text x="500.00" y="576.00" fill="#713f12" font-size="13" font-weight="800" text-anchor="middle">VVIP DIAMOND</text>
    <text x="500.00" y="593.00" fill="#a16207" font-size="10" font-weight="600" text-anchor="middle">Trung tâm hạng nhất</text>
  </g>

  <!-- Legend Bar -->
  <g id="sc-legend" data-map-chrome="true" transform="translate(48, 875)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
    <text x="20" y="11" fill="#334155" font-size="11" font-weight="600">GA Fanzone</text>

    <rect x="118" y="0" width="14" height="14" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
    <text x="138" y="11" fill="#334155" font-size="11" font-weight="600">VVIP Diamond</text>

    <rect x="248" y="0" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="268" y="11" fill="#334155" font-size="11" font-weight="600">VIP Platinum</text>

    <rect x="372" y="0" width="14" height="14" rx="3" fill="#fed7aa" stroke="#d97706" stroke-width="1.2"/>
    <text x="392" y="11" fill="#334155" font-size="11" font-weight="600">Khán đài A – B</text>

    <rect x="502" y="0" width="14" height="14" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="522" y="11" fill="#334155" font-size="11" font-weight="600">Upper Tier (C-D)</text>
  </g>
</svg>

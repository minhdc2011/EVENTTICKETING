<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="100%" height="100%" role="img" aria-label="Sơ đồ mặt bằng sân vận động Mỹ Đình" style="background:#0b1326;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <title>Sơ đồ mặt bằng sân vận động Mỹ Đình</title>
  <desc>Sơ đồ sân vận động tiêu chuẩn Ticketmaster End-Stage với sân khấu ở phía trên, khu Fanzone đứng trước sân khấu và các tầng khán đài VVIP, VIP Platinum, Khán đài A-B, Upper Tier bao quanh. Sinh bởi scripts/build-super-concert-map.mjs.</desc>
  <style>text { pointer-events: none; }</style>
  <defs>
    <linearGradient id="sc-stage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sc-floor-ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sc-vip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sc-bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="sc-upper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Header Bar -->
  <rect x="0" y="0" width="1000" height="60" fill="#070d1a"/>
  <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="1">EVENTTICKETING STADIUM SEATING CHART</text>
  <text x="960" y="38" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">SƠ ĐỒ SÂN VẬN ĐỘNG MỸ ĐÌNH</text>

  <!-- Stadium Outer Perimeter Ring -->
  <path d="M 891.31 180.14 A 472 420 0 1 1 108.69 180.14" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Stage Complex -->
  <g id="stage-complex" filter="url(#sc-glow)">
    <rect x="330" y="84" width="340" height="84" rx="8" fill="url(#sc-stage-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="124" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="3">SÂN KHẤU · STAGE</text>
    <text x="500" y="148" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">MAIN STADIUM END-STAGE</text>
    <polygon points="460,168 540,168 522,222 478,222" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="500" cy="222" r="22" fill="#0284c7" stroke="#e0f2fe" stroke-width="2"/>
    <text x="500" y="225" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">B-STAGE</text>
  </g>

  <!-- Floor GA Standing -->
  <g id="floor-ga" filter="url(#sc-glow)">
    <rect data-zone-code="GA_STAND_1" role="button" tabindex="0" aria-label="GA Fanzone Standing 1 (Khu A)" x="340" y="256" width="320" height="114" rx="8" fill="url(#sc-floor-ga)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <text x="500" y="308" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">STANDING · FANZONE</text>
    <text x="500" y="328" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">Khu vé đứng tự do sát sân khấu</text>
  </g>

  <!-- Sound & Lighting Mix (FOH) -->
  <rect x="440" y="424" width="120" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="500" y="446" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">SOUND MIX / FOH</text>

  <!-- Seated Stadium Bowls -->
  <g id="sc-zones" filter="url(#sc-glow)">
    <path data-zone-code="ZONE_CD_UP" role="button" tabindex="0" aria-label="Khán đài C-D Tầng cao (Upper Tier)" data-arc="500 415 452 400 352 310 -29 209" d="M 883.32 203.03 A 452 400 0 1 1 116.68 203.03 L 201.49 250.73 A 352 310 0 1 0 798.51 250.73 Z" fill="url(#sc-upper)" stroke="#ffffff" stroke-width="1"/>
    <path data-zone-code="ZONE_A_T1" role="button" tabindex="0" aria-label="Khán đài A Tầng 1 (Tribune A)" data-arc="500 415 326 286 242 210 137 209" d="M 273.54 620.73 A 326 286 0 0 1 223.54 263.44 L 294.77 303.72 A 242 210 0 0 0 331.89 566.06 Z" fill="url(#sc-bowl)" stroke="#ffffff" stroke-width="1.2"/>
    <path data-zone-code="ZONE_B_T2" role="button" tabindex="0" aria-label="Khán đài B Tầng 2 (Tribune B)" data-arc="500 415 326 286 242 210 -29 43" d="M 776.46 263.44 A 326 286 0 0 1 726.46 620.73 L 668.11 566.06 A 242 210 0 0 0 705.23 303.72 Z" fill="url(#sc-bowl)" stroke="#ffffff" stroke-width="1.2"/>
    <path data-zone-code="VIP_PLATINUM_1" role="button" tabindex="0" aria-label="VIP Platinum 1" data-arc="500 415 326 286 242 210 52 128" d="M 709.55 634.09 A 326 286 0 0 1 290.45 634.09 L 344.45 575.87 A 242 210 0 0 0 655.55 575.87 Z" fill="url(#sc-vip)" stroke="#ffffff" stroke-width="1.5"/>
    <path data-zone-code="VVIP_DIAMOND" role="button" tabindex="0" aria-label="VVIP Diamond Lounge" data-arc="500 415 222 192 162 138 51 129" d="M 648.55 557.68 A 222 192 0 0 1 351.45 557.68 L 391.60 517.55 A 162 138 0 0 0 608.40 517.55 Z" fill="#2563eb" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <path d="M 948.03 362.10 L 848.91 374.00 M 932.71 530.61 L 836.98 504.60 M 840.09 678.48 L 764.85 619.19 M 686.72 779.27 L 645.41 697.31 M 500.00 815.00 L 500.00 725.00 M 313.28 779.27 L 354.59 697.31 M 159.91 678.48 L 235.15 619.19 M 67.29 530.61 L 163.02 504.60 M 51.97 362.10 L 151.09 374.00 M 193.66 512.82 L 272.59 486.82 M 175.79 385.10 L 259.33 393.05 M 824.21 385.10 L 740.67 393.05 M 806.34 512.82 L 727.41 486.82 M 575.18 693.29 L 555.81 619.34 M 424.82 693.29 L 444.19 619.34 M 553.71 601.30 L 539.19 548.90 M 446.29 601.30 L 460.81 548.90" fill="none" stroke="rgba(11, 19, 38, 0.55)" stroke-width="1.6" pointer-events="none" aria-hidden="true"/>

  <!-- Zone Labels -->
  <g id="sc-labels" pointer-events="none" aria-hidden="true">
    <text x="500.00" y="766.00" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">KHÁN ĐÀI C-D · UPPER TIER (TẦNG CAO)</text>
    <text x="500.00" y="783.00" fill="#ddd6fe" font-size="10" font-weight="600" text-anchor="middle">Tầm nhìn bao quát toàn sân vận động</text>
    <text x="218.12" y="441.22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KHÁN ĐÀI A</text>
    <text x="218.12" y="458.22" fill="#fef3c7" font-size="10" font-weight="600" text-anchor="middle">Tầng 1</text>
    <text x="781.88" y="441.22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KHÁN ĐÀI B</text>
    <text x="781.88" y="458.22" fill="#fef3c7" font-size="10" font-weight="600" text-anchor="middle">Tầng 2</text>
    <text x="500.00" y="659.00" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">VIP PLATINUM 1</text>
    <text x="500.00" y="676.00" fill="#bfdbfe" font-size="10" font-weight="600" text-anchor="middle">Trung tâm tầng 1</text>
    <text x="500.00" y="576.00" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">VVIP DIAMOND</text>
    <text x="500.00" y="593.00" fill="#fef08a" font-size="10" font-weight="600" text-anchor="middle">Trung tâm hạng nhất</text>
  </g>

  <!-- Legend Bar -->
  <g id="sc-legend" transform="translate(70, 875)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#10b981"/>
    <text x="22" y="13" fill="#cbd5e1" font-size="11">GA Fanzone Standing</text>

    <rect x="165" y="0" width="16" height="16" rx="3" fill="#3b82f6"/>
    <text x="187" y="13" fill="#cbd5e1" font-size="11">VVIP &amp; VIP Platinum</text>

    <rect x="325" y="0" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="347" y="13" fill="#cbd5e1" font-size="11">Khán đài A – B</text>

    <rect x="465" y="0" width="16" height="16" rx="3" fill="#8b5cf6"/>
    <text x="487" y="13" fill="#cbd5e1" font-size="11">Upper Tier (Khán đài C-D)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%" style="background: #0d1527; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="th-stage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="th-orch-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="th-orch-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="th-mezz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="th-balcony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="th-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Header Bar -->
  <rect x="0" y="0" width="1000" height="60" fill="#070c18"/>
  <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="1">TICKETMASTER THEATER & AUDITORIUM SEATING CHART</text>
  <text x="960" y="38" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="end">SƠ ĐỒ NHÀ HÁT & KHÁN PHÒNG CAO CẤP</text>

  <!-- Theater Walls -->
  <path d="M 120 180 L 100 780 L 900 780 L 880 180 Z" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Proscenium Stage -->
  <g id="proscenium-stage" filter="url(#th-shadow)">
    <!-- Stage Arch -->
    <rect x="250" y="80" width="500" height="90" rx="8" fill="url(#th-stage-grad)" stroke="#f87171" stroke-width="2"/>
    <text x="500" y="125" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="4">SÂN KHẤU · PROSCENIUM STAGE</text>
    <text x="500" y="150" fill="#fecaca" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">MAIN AUDITORIUM STAGE</text>

    <!-- Orchestra Pit -->
    <path d="M 320 170 Q 500 210 680 170 Z" fill="#182234" stroke="#475569" stroke-width="1.5"/>
    <text x="500" y="190" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">ORCHESTRA PIT / HỐ NHẠC</text>
  </g>

  <!-- Private Loge Boxes (Side Wall Suites) -->
  <g id="boxes-left" filter="url(#th-shadow)">
    <rect x="110" y="210" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="150" y="245" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX A</text>

    <rect x="100" y="285" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="140" y="320" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX B</text>

    <rect x="90" y="360" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="395" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX C</text>
  </g>

  <g id="boxes-right" filter="url(#th-shadow)">
    <rect x="810" y="210" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="850" y="245" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX D</text>

    <rect x="820" y="285" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="860" y="320" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX E</text>

    <rect x="830" y="360" width="80" height="60" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="870" y="395" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BOX F</text>
  </g>

  <!-- Tier 1: Orchestra Level (Tầng trệt) -->
  <g id="orchestra-level" filter="url(#th-shadow)">
    <!-- Orchestra Left -->
    <path d="M 210 220 L 320 220 L 300 440 L 180 440 Z" fill="url(#th-orch-side)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="250" y="330" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">ORCHESTRA</text>
    <text x="250" y="350" fill="#fef3c7" font-size="11" font-weight="600" text-anchor="middle">LEFT</text>

    <!-- Orchestra Center VIP -->
    <path d="M 340 220 L 660 220 L 670 440 L 330 440 Z" fill="url(#th-orch-center)" stroke="#fde047" stroke-width="2"/>
    <text x="500" y="325" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">ORCHESTRA CENTER (VIP)</text>
    <text x="500" y="350" fill="#fef08a" font-size="12" font-weight="700" text-anchor="middle">Khu vực khán phòng trung tâm VIP</text>

    <!-- Orchestra Right -->
    <path d="M 680 220 L 790 220 L 820 440 L 700 440 Z" fill="url(#th-orch-side)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="750" y="330" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">ORCHESTRA</text>
    <text x="750" y="350" fill="#fef3c7" font-size="11" font-weight="600" text-anchor="middle">RIGHT</text>
  </g>

  <!-- Center Aisle Marker -->
  <line x1="330" y1="220" x2="330" y2="440" stroke="#0f172a" stroke-width="6"/>
  <line x1="670" y1="220" x2="670" y2="440" stroke="#0f172a" stroke-width="6"/>

  <!-- Tier 2: Mezzanine Level (Tầng lửng) -->
  <g id="mezzanine-level" filter="url(#th-shadow)">
    <path d="M 160 480 L 840 480 L 860 610 L 140 610 Z" fill="url(#th-mezz)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Left / Center / Right divisions -->
    <line x1="360" y1="480" x2="350" y2="610" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="640" y1="480" x2="650" y2="610" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="250" y="550" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MEZZANINE LEFT</text>
    <text x="500" y="540" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">FRONT MEZZANINE (CENTER)</text>
    <text x="500" y="562" fill="#bfdbfe" font-size="11" font-weight="600" text-anchor="middle">Tầm nhìn cao thoáng, âm thanh cân bằng</text>
    <text x="750" y="550" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MEZZANINE RIGHT</text>
  </g>

  <!-- Tier 3: Balcony Tier (Tầng ban công cao) -->
  <g id="balcony-level" filter="url(#th-shadow)">
    <path d="M 120 640 L 880 640 L 900 760 L 100 760 Z" fill="url(#th-balcony)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="500" y="700" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">UPPER BALCONY · TẦNG BAN CÔNG</text>
    <text x="500" y="725" fill="#e9d5ff" font-size="11" text-anchor="middle">Khán đài tầng cao giá tiết kiệm</text>
  </g>

  <!-- Legend Bar -->
  <g id="th-legend" transform="translate(130, 830)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#d97706"/>
    <text x="24" y="13" fill="#cbd5e1" font-size="11">Orchestra Floor</text>

    <rect x="160" y="0" width="16" height="16" rx="3" fill="#047857"/>
    <text x="184" y="13" fill="#cbd5e1" font-size="11">Loge / Private Boxes</text>

    <rect x="340" y="0" width="16" height="16" rx="3" fill="#2563eb"/>
    <text x="364" y="13" fill="#cbd5e1" font-size="11">Mezzanine Level</text>

    <rect x="520" y="0" width="16" height="16" rx="3" fill="#7c3aed"/>
    <text x="544" y="13" fill="#cbd5e1" font-size="11">Upper Balcony</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%" style="background: #f3f6fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>text { pointer-events: none; }</style>
  <defs>
    <linearGradient id="th-stage-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="th-box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="th-orch-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="th-orch-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="th-mezz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="th-balcony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="th-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Header Bar -->
  <g id="th-header" data-map-chrome="true">
    <rect x="0" y="0" width="1000" height="56" fill="#ffffff"/>
    <line x1="0" y1="56" x2="1000" y2="56" stroke="#dce4ee" stroke-width="1"/>
    <text x="40" y="35" fill="#1f262d" font-size="16" font-weight="700" letter-spacing="0.8">EVENTTICKETING THEATER SEATING CHART</text>
    <text x="960" y="35" fill="#525b6c" font-size="13" font-weight="600" text-anchor="end">SƠ ĐỒ NHÀ HÁT &amp; KHÁN PHÒNG CAO CẤP</text>
  </g>

  <!-- Theater Walls -->
  <path d="M 120 180 L 100 780 L 900 780 L 880 180 Z" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Proscenium Stage -->
  <g id="proscenium-stage" filter="url(#th-shadow)">
    <rect x="250" y="80" width="500" height="88" rx="10" fill="url(#th-stage-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="122" fill="#f8fafc" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="3">SÂN KHẤU · PROSCENIUM STAGE</text>
    <text x="500" y="146" fill="#93c5fd" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">MAIN AUDITORIUM STAGE</text>

    <path d="M 320 168 Q 500 206 680 168 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="500" y="187" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">HỐ NHẠC · ORCHESTRA PIT</text>
  </g>

  <!-- Private Loge Boxes (Side Wall Suites) -->
  <g id="boxes-left" filter="url(#th-shadow)">
    <rect data-zone-code="BOX_A" role="button" tabindex="0" aria-label="Private Box A" x="110" y="210" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="150" y="244" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX A</text>

    <rect data-zone-code="BOX_B" role="button" tabindex="0" aria-label="Private Box B" x="100" y="285" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="140" y="319" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX B</text>

    <rect data-zone-code="BOX_C" role="button" tabindex="0" aria-label="Private Box C" x="90" y="360" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="130" y="394" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX C</text>
  </g>

  <g id="boxes-right" filter="url(#th-shadow)">
    <rect data-zone-code="BOX_D" role="button" tabindex="0" aria-label="Private Box D" x="810" y="210" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="850" y="244" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX D</text>

    <rect data-zone-code="BOX_E" role="button" tabindex="0" aria-label="Private Box E" x="820" y="285" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="860" y="319" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX E</text>

    <rect data-zone-code="BOX_F" role="button" tabindex="0" aria-label="Private Box F" x="830" y="360" width="80" height="60" rx="6" fill="url(#th-box-grad)" stroke="#059669" stroke-width="1.4"/>
    <text x="870" y="394" fill="#064e3b" font-size="11" font-weight="800" text-anchor="middle">BOX F</text>
  </g>

  <!-- Tier 1: Orchestra Level (Tầng trệt) -->
  <g id="orchestra-level" filter="url(#th-shadow)">
    <g data-zone-code="ORCHESTRA_LEFT" role="button" tabindex="0" aria-label="Orchestra Left">
      <path d="M 210 220 L 320 220 L 300 440 L 180 440 Z" fill="url(#th-orch-side)" stroke="#d97706" stroke-width="1.4"/>
      <text x="250" y="328" fill="#78350f" font-size="12" font-weight="800" text-anchor="middle" pointer-events="none">ORCHESTRA</text>
      <text x="250" y="346" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle" pointer-events="none">LEFT</text>
    </g>

    <g data-zone-code="ORCHESTRA_CENTER" role="button" tabindex="0" aria-label="Orchestra Center VIP">
      <path d="M 340 220 L 660 220 L 670 440 L 330 440 Z" fill="url(#th-orch-center)" stroke="#b45309" stroke-width="1.8"/>
      <text x="500" y="325" fill="#713f12" font-size="16" font-weight="800" text-anchor="middle" pointer-events="none">ORCHESTRA CENTER (VIP)</text>
      <text x="500" y="350" fill="#a16207" font-size="12" font-weight="700" text-anchor="middle" pointer-events="none">Khu vực khán phòng trung tâm VIP</text>
    </g>

    <g data-zone-code="ORCHESTRA_RIGHT" role="button" tabindex="0" aria-label="Orchestra Right">
      <path d="M 680 220 L 790 220 L 820 440 L 700 440 Z" fill="url(#th-orch-side)" stroke="#d97706" stroke-width="1.4"/>
      <text x="750" y="328" fill="#78350f" font-size="12" font-weight="800" text-anchor="middle" pointer-events="none">ORCHESTRA</text>
      <text x="750" y="346" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle" pointer-events="none">RIGHT</text>
    </g>
  </g>

  <!-- Center Aisle Marker -->
  <line x1="330" y1="220" x2="330" y2="440" stroke="#e2e8f0" stroke-width="5"/>
  <line x1="670" y1="220" x2="670" y2="440" stroke="#e2e8f0" stroke-width="5"/>

  <!-- Tier 2: Mezzanine Level (Tầng lửng) -->
  <g id="mezzanine-level" filter="url(#th-shadow)">
    <path data-zone-code="MEZZANINE_LEFT" role="button" tabindex="0" aria-label="Mezzanine Left" d="M 160 480 L 360 480 L 350 610 L 140 610 Z" fill="url(#th-mezz)" stroke="#2563eb" stroke-width="1.4"/>
    <path data-zone-code="MEZZANINE_CENTER" role="button" tabindex="0" aria-label="Front Mezzanine Center" d="M 360 480 L 640 480 L 650 610 L 350 610 Z" fill="url(#th-mezz)" stroke="#2563eb" stroke-width="1.4"/>
    <path data-zone-code="MEZZANINE_RIGHT" role="button" tabindex="0" aria-label="Mezzanine Right" d="M 640 480 L 840 480 L 860 610 L 650 610 Z" fill="url(#th-mezz)" stroke="#2563eb" stroke-width="1.4"/>

    <text x="250" y="550" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle">MEZZANINE LEFT</text>
    <text x="500" y="540" fill="#1e3a8a" font-size="15" font-weight="800" text-anchor="middle">FRONT MEZZANINE (CENTER)</text>
    <text x="500" y="562" fill="#1d4ed8" font-size="11" font-weight="600" text-anchor="middle">Tầm nhìn cao thoáng, âm thanh cân bằng</text>
    <text x="750" y="550" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle">MEZZANINE RIGHT</text>
  </g>

  <!-- Tier 3: Balcony Tier (Tầng ban công cao) -->
  <g id="balcony-level" filter="url(#th-shadow)">
    <path data-zone-code="UPPER_BALCONY" role="button" tabindex="0" aria-label="Upper Balcony" d="M 120 640 L 880 640 L 900 760 L 100 760 Z" fill="url(#th-balcony)" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="500" y="700" fill="#4c1d95" font-size="15" font-weight="800" text-anchor="middle">UPPER BALCONY · TẦNG BAN CÔNG</text>
    <text x="500" y="725" fill="#6d28d9" font-size="11" font-weight="600" text-anchor="middle">Khán đài tầng cao giá tiết kiệm</text>
  </g>

  <!-- Legend Bar -->
  <g id="th-legend" data-map-chrome="true" transform="translate(48, 835)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
    <text x="20" y="11" fill="#334155" font-size="11" font-weight="600">Orchestra VIP</text>

    <rect x="134" y="0" width="14" height="14" rx="3" fill="#fed7aa" stroke="#d97706" stroke-width="1.2"/>
    <text x="154" y="11" fill="#334155" font-size="11" font-weight="600">Orchestra Side</text>

    <rect x="272" y="0" width="14" height="14" rx="3" fill="#a7f3d0" stroke="#059669" stroke-width="1.2"/>
    <text x="292" y="11" fill="#334155" font-size="11" font-weight="600">Private Box</text>

    <rect x="396" y="0" width="14" height="14" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="416" y="11" fill="#334155" font-size="11" font-weight="600">Mezzanine</text>

    <rect x="514" y="0" width="14" height="14" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="534" y="11" fill="#334155" font-size="11" font-weight="600">Upper Balcony</text>
  </g>
</svg>


name: DB replay

# Rebuilds the whole database from the migration chain on a clean local Supabase and runs the green pgTAP suites.
# Catches migrations that cannot be replayed from scratch (see docs/LOCAL_DEV_DATABASE.md).
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/db-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Supabase (applies every migration from scratch, then seed.sql)
        run: npm run db:start

      - name: pgTAP (suites that are green today)
        run: npm run db:test:ci

      - name: Stop Supabase
        if: always()
        run: npm run db:stop

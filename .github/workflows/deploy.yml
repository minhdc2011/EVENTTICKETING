name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify and build project
        env:
          VITE_BASE_URL: './'
          VITE_USE_MOCK_DATA: 'false'
          VITE_SUPABASE_URL: 'https://qxkgkbayxxaakkwtepss.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_mCPTLgmw3RBji1qcZ9urKw_rAWc-igK'
          VITE_EVENT_DATABASE_ID: '1'
          VITE_EVENT_ID: 'SUPER_CONCERT_2026'
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

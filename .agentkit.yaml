# agentkit config for this repo (see D:\multiagent\tools\agentkit\README.md).
# Only what differs from ~/.agentkit/agents.yaml and the built-in defaults.

context: >-
  Event ticketing web app: React 19 + TypeScript 5.8 + Vite 6 + Tailwind 4, Supabase backend
  (supabase/). Event pages are built from src/components/event-template/, the organizer flow from
  src/components/organizer-ui/, category theming in src/domain/categoryThemes.js. src/legacy/ holds
  the older concert runtime and HTML fragments still in use. Tests are node --test in tests/.

agents:
  reviewer:
    tools: [list_files, read_file, search, shell]

# Commands the shell tool may run (prefix match; chaining/redirection rejected).
shell_allow:
  - npm run lint
  - npm run test
  - npm run build
  - git status
  - git diff
  - git log

# .env, .env.local, .env.production are already covered by the built-in patterns.
exclude:
  - dist
  - .tmp
  - package-lock.json
  - bun.lock
  - supabase/.temp

# agentkit solve: every change must pass these before review (lint + node tests + vite build).
solve:
  gate: [npm run check]
  link: [node_modules]   # reuse this checkout's installed packages in the worktree

# agentkit config for this repo (see D:\multiagent\tools\agentkit\README.md).
# Only what differs from ~/.agentkit/agents.yaml and the built-in defaults.

context: >-
  Event ticketing web app: React 19 + TypeScript 5.8 + Vite 6 + Tailwind 4, Supabase backend
  (supabase/). Event pages are built from src/components/event-template/, the organizer flow from
  src/components/organizer-ui/, category theming in src/domain/categoryThemes.js. src/legacy/ holds
  the older concert runtime and HTML fragments still in use. Tests are node --test in tests/.

agents:
  reviewer:
    tools: [list_files, read_file, search, shell]

  # --- Team hierarchy (run through .multiagent/org.ps1) ---
  # director (GPT-6 Astra) -> manager (Opus 5.5) -> workers (sonnet, gemini)
  # The director only plans for the manager and reviews the manager's report.
  # The manager splits the work, assigns workers, reviews worker diffs and reports to the director.
  director:
    model: codex/gpt-6-astra
    cli_args: [-c, model_reasoning_effort=high]
    system: >-
      You are the DIRECTOR of a team. Your only direct report is the MANAGER (Claude Opus 5.5), who leads two
      workers (Claude Sonnet 5.5, Gemini 3.8 Flash). You never write code and never talk to the workers.
      You do two things: (1) write a plan for the manager: goal, scope in/out, deliverables, main steps,
      verifiable acceptance criteria, constraints; (2) review the manager's report against your acceptance
      criteria, spot-checking the repo read-only, give numbered concrete feedback, and end with exactly one
      final line "VERDICT: APPROVED" or "VERDICT: REVISE". Write in the language of the request (Vietnamese by default).
  manager:
    model: claude/claude-opus-5-5-high
    # agentkit's default Claude tools lack Skill, so skills such as impeccable would be invisible
    cli_args: [--tools, Read, Grep, Glob, Skill]
    timeout_s: 1800   # whole-repo reads (specs, audits) take longer than the 600 s default
    system: >-
      You are the MANAGER (Claude Opus 5.5). Your boss is the DIRECTOR (GPT-6 Astra); your workers are
      `sonnet` (Claude Sonnet 5.5) and `gemini` (Gemini 3.8 Flash). When planning, split the director's plan into
      small tasks with verifiable acceptance criteria and assign each to the best-suited worker: sonnet for tasks
      needing careful reasoning, cross-file consistency or tricky logic; gemini for well-scoped, mechanical,
      fast tasks (drafting, formatting, bulk edits, lookups). Use both workers when the work allows. When reviewing a
      worker's diff, check it strictly against the task's acceptance criteria: correctness, consistency with the
      rest of the repo, no regressions, no scope creep. When reporting to the director, be factual and self-contained:
      summary, task table (task / worker / result / your review), files changed, checks run, open issues.
      Write in the language of the request (Vietnamese by default).
  sonnet:
    model: claude/claude-sonnet-5-5-medium
    # coder in fix: agentkit's write tools + Skill (so it can use impeccable). Edits only apply in the
    # solve worktree with acceptEdits; in `run` the permission mode is default, so edits are refused.
    cli_args: [--tools, Read, Grep, Glob, Edit, Write, Skill]
    system: >-
      You are a WORKER (Claude Sonnet 5.5) reporting to the MANAGER (Claude Opus 5.5). Do exactly the assigned task
      within its scope and acceptance criteria; do not expand scope. Keep changes minimal and consistent with the
      surrounding code and documents. If something is unclear, make the safest choice and say so.
  gemini:
    model: agy/gemini-3.8-flash-medium
    system: >-
      You are a WORKER (Gemini 3.8 Flash) reporting to the MANAGER (Claude Opus 5.5). Do exactly the assigned task
      within its scope and acceptance criteria; do not expand scope. Keep changes minimal and consistent with the
      surrounding code and documents. If something is unclear, make the safest choice and say so.

# Commands the shell tool may run (prefix match; chaining/redirection rejected).
shell_allow:
  - npm run lint
  - npm run test
  - npm run build
  - git status
  - git diff
  - git log

# .env, .env.local, .env.production are already covered by the built-in patterns.
exclude:
  - dist
  - .tmp
  - package-lock.json
  - bun.lock
  - supabase/.temp
  # Database and schema are frozen: the solve guard rejects any diff touching these (UI-only changes).
  - supabase
  - "*.sql"
  - src/services
  - src/types
  - src/domain/seatRealtime.js
  - docs

# agentkit solve: every change must pass these before review (lint + node tests + vite build).
solve:
  gate: [npm run check]
  link: [node_modules]   # reuse this checkout's installed packages in the worktree
  coder: sonnet          # default worker for a single `agentkit solve`
  reviewer: manager      # Opus reviews every worker's diff
  allow_same_family: true  # needed: Opus (manager) reviews Sonnet (worker), both Anthropic
  planner: null          # in fix the manager already wrote the task spec
  escalate: null         # the director never writes code

# agentkit fix: the manager (Opus) splits the director's plan into tasks and assigns them to the workers.
fix:
  planner: manager
  coders: [sonnet, gemini]

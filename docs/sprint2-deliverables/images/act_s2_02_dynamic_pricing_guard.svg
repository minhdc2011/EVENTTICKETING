<rect x="0" y="0" width="1520" height="1020" fill="#F8FAFC"/>
<rect x="0" y="0" width="1520" height="82" fill="#2A3342"/>
<text x="34" y="38" font-size="21" font-weight="700" fill="#FFFFFF">ACTIVITY DIAGRAM 02 — DYNAMIC PRICING 5 BƯỚC, PRICEGUARD &amp; HUMAN-IN-THE-LOOP</text>
<text x="34" y="60" font-size="12.5" fill="#94A3B8">Quy trình khép kín: Cấu hình Quy tắc -&gt; Mô phỏng -&gt; Engine 5 bước -&gt; PriceGuard -&gt; BTC Duyệt (PT409) -&gt; Immutable Audit &amp; Realtime</text>
<text x="1341.0" y="38" text-anchor="end" font-size="16" font-weight="700" fill="#2BB5B0" letter-spacing="0.8">EVENTTICKETING</text>
<rect x="1357.0" y="20" width="129.0" height="24" rx="12" fill="#F59E0B"/>
<text x="1421.5" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Activity S2-02</text>
<rect x="30" y="102" width="430" height="886" rx="8" fill="#FFFBEB" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="30" y="102" width="430" height="34" rx="8" fill="#D97706"/>
<text x="245.0" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">SWIMLANE 1: BAN TỔ CHỨC (HUMAN-IN-THE-LOOP)</text>
<rect x="460" y="102" width="510" height="886" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="460" y="102" width="510" height="34" rx="8" fill="#3E5258"/>
<text x="715.0" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">SWIMLANE 2: PRICING ENGINE (5 BƯỚC)</text>
<rect x="970" y="102" width="520" height="886" rx="8" fill="#F0FDFA" stroke="#CBD5E1" stroke-width="1.4"/>
<rect x="970" y="102" width="520" height="34" rx="8" fill="#0F766E"/>
<text x="1230.0" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">SWIMLANE 3: POSTGRESQL (GUARD, PT409 & REALTIME)</text>
<circle cx="245" cy="170" r="12" fill="#1E293B"/>
<rect x="70" y="204" width="350" height="56" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="245.0" y="228.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">1. Cấu hình Quy tắc giá khu vực</text>
<text x="245.0" y="244.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">P0, Pmin, Pmax, S, DeltaMax, wr/wv/wt</text>
<rect x="1020" y="204" width="420" height="56" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230.0" y="228.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">2. RPC luu_quy_tac_gia()</text>
<text x="1230.0" y="244.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">UPSERT QUY_TAC_GIA + Ghi NHAT_KY_DINH_GIA</text>
<rect x="70" y="302" width="350" height="54" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="245.0" y="325.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">3. [Tùy chọn] Chạy Mô phỏng nhu cầu</text>
<text x="245.0" y="341.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">ban_nhanh / ban_cham / ban_deu (MO_PHONG_GHE)</text>
<rect x="1020" y="302" width="420" height="54" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230.0" y="325.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">4. RPC lay_so_lieu_dinh_gia()</text>
<text x="1230.0" y="341.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">Trả r (lấp đầy), u, u_exp (tốc độ), Trem (giờ)</text>
<rect x="505" y="386" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#3E5258" stroke-width="1.8" filter="url(#sh)"/>
<text x="715.0" y="409.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">5. Engine 5 bước (computePriceProposal)</text>
<text x="715.0" y="425.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">B1: Tính r, u, Trem -&gt; B2: Δr, Δv, Δt -&gt; P_raw</text>
<text x="715.0" y="441.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">B3: Ràng buộc biên độ Δmax -&gt; B4: Làm tròn bước S</text>
<text x="715.0" y="457.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">B5: Clamp [Pmin, Pmax] &amp; Vùng chết Deadband</text>
<rect x="1020" y="502" width="420" height="58" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230.0" y="527.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">6. RPC luu_de_xuat_gia() [PriceGuard]</text>
<text x="1230.0" y="543.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">Kiểm tra QUY_TAC_GIA.NgayCapNhat &amp; [Pmin, Pmax]</text>
<polygon points="1230,578 1360,616 1230,654 1100,616" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230" y="613" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">PriceGuard</text>
<text x="1230" y="627" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">hợp lệ?</text>
<rect x="505" y="590" width="420" height="52" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
<text x="715.0" y="612.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">Chặn đề xuất &amp; Ghi NHAT_KY_DINH_GIA</text>
<text x="715.0" y="628.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#991B1B">(LoaiSuKien = CHAN_DE_XUAT) -&gt; Tính lại</text>
<rect x="70" y="676" width="350" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="245.0" y="703.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">7. BTC xem thẻ DE_XUAT_GIA (CHO_DUYET)</text>
<text x="245.0" y="719.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">Đọc giải trình r, u, Trem &amp; Cảnh báo vượt khung</text>
<polygon points="245,758 370,796 245,834 120,796" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
<text x="245" y="793" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">BTC quyết</text>
<text x="245" y="807" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">định?</text>
<rect x="505" y="770" width="420" height="52" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8" filter="url(#sh)"/>
<text x="715.0" y="792.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E293B">Từ chối: RPC tu_choi_de_xuat_gia()</text>
<text x="715.0" y="808.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1E293B">DE_XUAT_GIA = DA_TU_CHOI (Giữ nguyên giá cũ)</text>
<rect x="1020" y="770" width="420" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230.0" y="790.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">8. Duyệt: RPC duyet_de_xuat_gia()</text>
<text x="1230.0" y="806.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#065F46">SELECT FOR UPDATE | Nếu giá đã đổi -&gt; PT409</text>
<text x="1230.0" y="822.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#065F46">Cập nhật KHU_VUC.GiaVeNiemYet = GiaDeXuat</text>
<rect x="1020" y="882" width="420" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
<text x="1230.0" y="902.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065F46">9. Ghi NHAT_KY_GIA (Bất biến NFR-08)</text>
<text x="1230.0" y="918.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#065F46">Phát Realtime UPDATE KHU_VUC -&gt; Khán giả</text>
<text x="1230.0" y="934.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#065F46">(Giữ nguyên DonGiaChot cho phiếu đang giữ)</text>
